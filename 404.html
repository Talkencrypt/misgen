<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Part Not Found | Misgen Auto Parts</title>
    <link rel="stylesheet" href="https://googleapis.com" />
    <style>
        body {
            background: #0D1513;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Centered 404 Layout Content */
        .error-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Matches your main layout margins and styles */
        .error-section {
            display: flex;
            gap: 50px;
            align-items: center;
            margin: 0% 15%;
            max-width: 900px;
        }

        /* Icon stylized perfectly like your content section images */
        .error-icon-box {
            width: 330px;
            height: 250px;
            background-color: #162421; /* Slightly lighter dark green block */
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .material-symbols-outlined.warning-icon {
            font-size: 90px;
            color: #bb2d3b; /* Matches business closed badge red color */
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
        }

        /* Replicates your precise content .text-block classes */
        .text-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .text-block h2 {
            margin: 0;
            font-size: 2.2rem;
            color: #ffffff;
        }

        .text-block p {
            margin: 0;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        /* Action button matches your footer form button styles */
        .home-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: fit-content;
            text-decoration: none;
            text-align: center;
            transition: background 0.2s ease-in-out;
        }

        .home-btn:hover {
            background-color: #1d4ed8;
            border-bottom-style: none; /* Disables the default nav link bottom underline border effect */
            color: white;
        }
    </style>
</head>
<body>
    <!-- Error Block using your exact horizontal flex structure -->
    <div class="error-wrapper">
        <div class="error-section">
           
            <div class="text-block">
                <h2>404 - Part Not Found</h2>
                <p>This section of the yard is empty. The webpage you are hunting down has been removed from our active inventory or has changed locations entirely.</p>
                <a href="./Index.html" class="home-btn">Return to Home Yard</a>
            </div>
        </div>
    </div>

</body>
</html>

    <!DOCTYPE html>
<html>
<head>
    <title>AutoPartsAPI Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input, button {
            padding: 12px;
            font-size: 16px;
            margin-top: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #1769aa;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        pre {
            margin-top: 20px;
            background: #111;
            color: #0f0;
            padding: 15px;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>AutoPartsAPI Test</h1>

    <input
        id="vin"
        value="1J4GL58K46W201071"
        maxlength="17"
    >

    <button onclick="testAPI()">
        Test API
    </button>

    <div id="status"></div>

    <pre id="result"></pre>

</div>


<script>

const API_KEY = "apk_cf9a53eff84a9923052dd52fb076714e9aeba743cd45154c";

const URL =
    "https://auto-parts-catalog.apiprofile.com/api/vin/decoder-v5/1J4GL58K46W201071";


async function testAPI() {

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    status.textContent =
        "Testing...";

    result.textContent = "";

    try {

        const response = await fetch(URL, {

            method: "GET",

            headers: {
                "x-apiprofile-key": API_KEY,
                "Accept": "application/json"
            }

        });

        const text =
            await response.text();

        console.log("STATUS:", response.status);
        console.log("RESPONSE:", text);

        status.textContent =
            `HTTP Status: ${response.status}`;

        result.textContent = text;

    } catch (error) {

        console.error(error);

        status.textContent =
            "Failed to fetch";

        result.textContent =
            error.message;

    }

}

</script>

</body>
</html>
